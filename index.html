 +sec('Sebelum dan selepas',tabs([['Prompt lemah',pb('Sebelum','Ringkaskan maklum balas peserta ini.')],['Prompt kuat',pb('Selepas','Anda penganalisis latihan di IAB. Di bawah ialah 20 komen terbuka peserta\nProgram Kepimpinan Pengetua Baharu Siri 3/2026.\n\n<komen>\n[tampal komen dari 03_Komen_Peserta.txt]\n</komen>\n\nTugasan:\n1. Kelaskan setiap komen kepada tema (cth. Penceramah, Kandungan, Logistik, Masa).\n2. Kira bilangan komen positif, negatif dan neutral bagi setiap tema.\n3. Pilih 2 petikan paling mewakili bagi setiap tema.\n4. Cadangkan 3 penambahbaikan berdasarkan bukti.\n\nFormat: jadual tema, kemudian senarai cadangan bernombor.\nJangan tambah maklumat yang tiada dalam komen.')]])),
 acts:[
  {id:'2.1',t:'Makmal prompt sebelum dan selepas',min:20,intro:'Setiap pasangan menerima satu prompt lemah. Tulis semula dengan PKTFCK, jalankan kedua-dua versi dan banding hasilnya.',steps:['Pasangan 1: <i>"Buat soalan penilaian kursus."</i>','Pasangan 2: <i>"Tulis ucapan perasmian."</i>','Pasangan 3: <i>"Ringkaskan maklum balas peserta ini."</i> (guna fail komen)','Banding: ketepatan, kebolehgunaan terus, konsistensi format, masa dijimatkan.'],files:['a3'],out:'Dua versi output untuk dibandingkan.'},
  {id:'2.2',t:'Templat prompt boleh guna semula',min:15,steps:['Pilih satu tugasan berulang dalam kerja anda.','Tulis prompt PKTFCK dengan ruang isian: <code>[NAMA PROGRAM]</code>, <code>[TARIKH]</code>, <code>[BILANGAN PESERTA]</code>.','Minta Claude menilai prompt anda dan perbaiki.','Simpan templat dalam Project anda.'],out:'Satu templat prompt yang diuji dan boleh dikongsi.'}
 ]},
{id:'modul-3',code:'M3',g:'HARI 1',title:'Multi-file Intelligence',dur:'1 jam',
 sum:'Claude boleh membaca beberapa fail serentak dan mencari kaitan, percanggahan serta jurang antara fail.',
 obj:['Memuat naik dan merujuk beberapa fail dalam satu perbualan atau Project.','Meminta Claude membanding, menyilang-semak dan mensintesis maklumat.','Meminta Claude menyatakan sumber bagi setiap dapatan.'],
 body:()=>sec('Empat corak analisis',cards([['Banding','"Banding Fail A dan Fail B dari segi objektif, tempoh dan sasaran. Paparkan dalam jadual."','01'],['Semak silang','"Senaraikan setiap percanggahan antara Fail A dan Fail B dengan rujukan."','02'],['Sintesis','"Gabungkan isi penting 4 fail ini menjadi satu ringkasan 1 halaman."','03'],['Analisis jurang','"Apakah keperluan Garis Panduan yang belum dipenuhi oleh Kertas Cadangan?"','04']]))
 +sec('Amalan baik',ul(['Namakan fail dengan jelas sebelum muat naik.','Rujuk fail dengan nama dalam prompt.','Minta rujukan: <i>"Nyatakan nama fail dan bahagian bagi setiap dapatan."</i>','Simpan dokumen yang sering digunakan dalam Project.','Semak dapatan penting dengan membuka fail asal.'])),
 acts:[
  {id:'3.1',t:'Semakan silang dokumen program',min:25,intro:'Jadual Program Draf mengandungi <b>4 kesilapan</b>. Cari kesemuanya.',steps:['Muat naik ketiga-tiga fail ke Project anda.','Jalankan prompt semakan silang.','Sahkan sekurang-kurangnya 2 isu dengan membuka fail asal.','Minta Claude menghasilkan <b>Jadual Program Versi 2</b> yang telah dibetulkan.'],
   prompts:[['Prompt','Semak silang tiga fail ini: Profil Program, Senarai Penceramah dan Jadual Program Draf.\n\nKenal pasti:\n1. Sesi dalam jadual yang penceramahnya tiada dalam Senarai Penceramah.\n2. Penceramah yang dijadualkan pada tarikh mereka tidak tersedia.\n3. Sesi yang tidak menyumbang kepada mana-mana objektif dalam Profil Program.\n4. Objektif program yang tiada sesi berkaitan.\n5. Pertindihan masa atau bilik.\n\nPaparkan dalam jadual: Isu | Butiran | Fail & bahagian | Cadangan pembetulan.']],
   files:['a1','a2','a4'],out:'Senarai isu bersama rujukan, dan jadual program yang dibetulkan.'},
  {id:'3.2',t:'Sintesis dasar untuk kertas taklimat',min:20,steps:['Muat naik 2–3 dokumen dasar awam berkaitan tugas anda (tidak terperingkat).','Jalankan prompt di bawah.','Minta Claude menyenaraikan perkara yang tidak dapat disahkan daripada dokumen.'],
   prompts:[['Prompt','Anda pegawai perancang di IAB. Berdasarkan dokumen-dokumen yang dilampirkan,\nsediakan kertas taklimat 1 halaman untuk Pengarah bertajuk\n"Implikasi dasar terhadap reka bentuk program kepimpinan sekolah 2027".\nStruktur: Tujuan, Isu utama (maksimum 5), Implikasi kepada IAB, Cadangan.\nSetiap isu mesti merujuk dokumen sumber dan bahagiannya.']],out:'Kertas taklimat 1 halaman dengan rujukan sumber.'}
 ]},
{id:'modul-4',code:'M4',g:'HARI 1',title:'Document Pipeline',dur:'2 jam',
 sum:'Saluran dokumen ialah urutan langkah tetap yang mengubah bahan mentah menjadi dokumen rasmi siap: kertas cadangan, surat, minit dan slaid.',
 obj:['Menggunakan saluran 6 langkah.','Menjana dokumen berbilang penerima daripada senarai.','Menukar nota mesyuarat kepada minit rasmi dengan senarai tindakan.','Menukar satu dokumen kepada format lain.'],
 body:()=>sec('Saluran 6 langkah',flow([['Input','Fail, nota, data, templat agensi'],['Rangka','Luluskan struktur dahulu'],['Draf','Bahagian demi bahagian'],['Semak','Claude sebagai penyemak bebas'],['Format','Templat, gaya, penomboran'],['Eksport','Word, PDF, slaid']])+note('<b>Prinsip.</b> Luluskan rangka sebelum draf. Membetulkan struktur di peringkat rangka jauh lebih cepat daripada menulis semula draf penuh.')),
 acts:[
  {id:'4.1',t:'Kertas cadangan program, saluran penuh',min:35,steps:['<b>Rangka:</b> jalankan Prompt 1.','<b>Lulus:</b> ubah rangka jika perlu, cth. <i>"Tambah bahagian Risiko."</i>','<b>Draf:</b> <i>"Tulis draf penuh berdasarkan rangka yang diluluskan. Maksimum 4 halaman. Guna penomboran 1.0, 1.1, 1.2."</i>','<b>Semak:</b> jalankan Prompt 2.','<b>Format dan eksport:</b> <i>"Laksanakan semua pembetulan, kemudian hasilkan fail Word."</i>'],
   prompts:[['Prompt 1 · Rangka','Berdasarkan Profil Program dalam Project ini, sediakan RANGKA sahaja untuk\nKertas Cadangan Program Kepimpinan Pengetua Baharu Siri 3/2026 kepada Pengarah IAB.\nGuna struktur kertas cadangan sektor awam: Tujuan, Latar Belakang, Objektif,\nKumpulan Sasaran, Kandungan Program, Kaedah Pelaksanaan, Implikasi Kewangan,\nPenilaian, Syor. Untuk setiap bahagian, beri 2–3 poin isi. Jangan tulis draf penuh lagi.'],
    ['Prompt 2 · Penyemak bebas','Kini bertindak sebagai Timbalan Pengarah yang menyemak kertas ini.\nSemak berdasarkan senarai ini dan beri ulasan dalam jadual (Bahagian | Isu | Cadangan):\n- Adakah objektif SMART?\n- Adakah angka kewangan konsisten di semua bahagian?\n- Adakah tarikh, bilangan peserta dan tempat konsisten?\n- Adakah bahasa baku dan nada rasmi?\n- Apakah soalan yang mungkin ditanya oleh Pengarah?']],
   files:['a1'],out:'Kertas cadangan 3–4 halaman, telah disemak, dalam format Word.'},
  {id:'4.2',t:'Surat jemputan berbilang penerima',min:20,steps:['Jalankan prompt dengan fail Senarai Penceramah.','Semak: adakah butiran setiap surat tepat dengan senarai?','Ubah satu baris dalam senarai dan jana semula.'],
   prompts:[['Prompt','Guna Senarai Penceramah. Hasilkan SATU surat jemputan rasmi bagi setiap penceramah\nmengikut format surat rasmi kerajaan: rujukan fail, tarikh, alamat penerima,\nperkara (huruf besar, tebal), isi bernombor, penutup "BERKHIDMAT UNTUK NEGARA",\ntandatangan [NAMA PENGARAH]. Isi: jemputan, tajuk sesi, tarikh & masa, tempat,\nbayaran saguhati [PERLU DISAHKAN], pegawai untuk dihubungi.\nHasilkan semua surat dalam satu fail Word, setiap surat bermula di halaman baharu.']],
   files:['a2'],out:'Satu fail Word dengan 5 surat.'},
  {id:'4.3',t:'Nota mesyuarat kepada minit rasmi',min:25,steps:['Jalankan prompt dengan fail nota mesyuarat.','Bertukar minit dengan pasangan dan semak ketepatan berbanding nota asal.'],
   prompts:[['Prompt','Tukar nota kasar ini kepada Minit Mesyuarat Jawatankuasa Pelaksana Program\nBil. 2/2026 mengikut format minit sektor awam: Kehadiran, Perutusan Pengerusi,\nPengesahan Minit Lalu, Perkara Berbangkit, Perkara Baharu, Hal-hal Lain, Penutup.\nBagi setiap keputusan, tulis "Keputusan:" dan "Tindakan:" dengan pegawai bertanggungjawab.\nAkhiri dengan Jadual Tindakan: Bil | Perkara | Tindakan oleh | Tarikh akhir.\nTandakan [TIDAK JELAS] jika nota tidak lengkap.']],
   files:['a5'],out:'Minit rasmi dengan Jadual Tindakan.'},
  {id:'4.4',t:'Kertas cadangan kepada slaid taklimat',min:15,
   prompts:[['Prompt','Daripada kertas cadangan yang telah siap, sediakan slaid taklimat 8 slaid\nuntuk Mesyuarat Pengurusan IAB. Satu mesej utama setiap slaid, maksimum 5 poin.\nSlaid terakhir: keputusan yang dipohon. Sertakan nota penceramah bagi setiap slaid.']],out:'Dek slaid yang boleh dieksport ke PowerPoint atau PDF.'}
 ]},
{id:'modul-mcp',code:'MCP',g:'HARI 1',title:'MCP & Penyambung',dur:'45 min',
 sum:'Sambungkan akaun Microsoft 365 dan Google Workspace supaya Claude boleh membaca dan bertindak terus dalam e-mel, kalendar dan fail anda.',
 obj:['Menerangkan konsep MCP dan penyambung.','Menyambung akaun Microsoft 365 atau Google Workspace kepada Claude.','Mencari fail, meringkaskan e-mel, menyemak kalendar dan menyediakan draf.','Mengawal kebenaran dan memutuskan sambungan.'],
 body:()=>sec('Apa itu MCP?',`<p><b>Model Context Protocol</b> ialah piawai terbuka yang menghubungkan Claude dengan aplikasi lain, seperti palam universal. Claude bertindak bagi pihak anda dan hanya boleh melihat data yang anda sendiri sudah ada akses.</p>`)
 +sec('Dua penyambung',tbl(['Perkara','Microsoft 365','Google Workspace'],[['Perkhidmatan','Outlook, SharePoint, OneDrive, Teams','Gmail, Calendar, Drive, Docs/Sheets/Slides'],['Baca','Fail, e-mel, kalendar, chat dan saluran Teams','E-mel, acara, fail Drive'],['Tulis','Hanya jika pentadbir mengaktifkan alat tulis','Draf atau hantar e-mel, acara, fail (dengan kelulusan anda)'],['Akaun','Akaun kerja dalam tenant Entra. Akaun peribadi tidak disokong','Akaun Google. Akaun organisasi mungkin perlu kelulusan pentadbir'],['Had','OneNote tidak dibaca; tiada lampiran pada alat tulis','Teks sahaja dari Drive; kandungan lampiran Gmail tidak dibaca']]))
 +note('<b>Sebelum bermula.</b> Sambungan akaun organisasi memerlukan kelulusan pentadbir ICT. Jika log masuk disekat, guna akaun Google latihan atau ikut demo jurulatih.','warn')
 +sec('Penyelesaian masalah',tbl(['Masalah','Tindakan'],[['Microsoft 365: log masuk gagal','Pastikan akaun kerja, bukan @outlook.com. Semak persetujuan pentadbir Entra.'],['Google: "Access blocked"','Pentadbir Google Workspace perlu menetapkan Claude sebagai aplikasi Trusted.'],['Google: "You may need to reconnect"','Putuskan dan sambung semula di Customize > Connectors.'],['Fail tidak dijumpai','Cari dengan nama fail tepat. Fail baharu mungkin belum diindeks.']])),
 acts:[
  {id:'S.1',t:'Sambung dan uji',min:10,steps:['Buka <b>Customize > Connectors</b>.','Cari Microsoft 365, atau Gmail / Google Calendar / Google Drive, klik <b>Connect</b>.','Log masuk dan beri kebenaran.','Jalankan tiga prompt ujian, satu demi satu.'],
   prompts:[['Prompt ujian','Apakah 3 mesyuarat saya minggu ini?\nCari e-mel terkini yang menyebut "penilaian kursus".\nCari fail bertajuk "Profil Program" dalam Drive/OneDrive saya.']],out:'Jawapan dengan rujukan dan pautan ke e-mel atau fail asal.'},
  {id:'S.2',t:'Google Workspace dalam senario urus setia',min:20,intro:'Muat naik dua fail di bawah ke Google Drive anda dahulu.',
   prompts:[['Prompt','1. Cari fail Profil Program PKPB Siri 3/2026 dan Nota Mesyuarat JK dalam Drive saya.\n2. Daripada nota mesyuarat, kenal pasti tarikh mesyuarat akan datang.\n3. Semak Google Calendar saya: adakah saya kosong pada tarikh dan masa itu?\n4. Jika kosong, cadangkan acara "Mesyuarat JK Pelaksana PKPB Bil. 3/2026",\n   2 jam, di Bilik Mesyuarat Utama. Tunjukkan butiran sebelum mencipta.\n5. Draf e-mel jemputan mesyuarat kepada ahli JK (guna alamat e-mel rekaan)\n   dengan agenda berdasarkan perkara belum selesai dalam nota. Simpan sebagai draf sahaja.\n6. Simpan minit ringkas sebagai Google Doc baharu dalam folder "PKPB3".']],
   files:['a1','a5'],out:'Acara kalendar, draf e-mel dan Google Doc, setiap satu selepas kelulusan anda.'},
  {id:'S.3',t:'Microsoft 365 dalam senario urus setia',min:20,intro:'Simpan fail sampel dalam OneDrive atau laman SharePoint latihan dahulu.',
   prompts:[['Prompt','1. Cari Jadual Program Draf dan Senarai Penceramah dalam OneDrive/SharePoint saya.\n   Senaraikan sesi yang penceramahnya tidak tersedia pada tarikh dijadualkan.\n2. Ringkaskan e-mel Outlook 7 hari lepas yang berkaitan "PKPB" atau "penceramah":\n   siapa, isu, tindakan diperlukan.\n3. Semak kalendar Outlook saya untuk slot 2 jam yang kosong minggu depan\n   bagi mesyuarat JK.\n4. Draf balasan e-mel kepada penceramah yang tarikhnya bertembung,\n   mencadangkan 2 tarikh alternatif. JANGAN hantar.']],
   files:['a2','a4'],out:'Ringkasan e-mel, slot mesyuarat dan draf balasan.'}
 ]},
{id:'modul-5',code:'M5',g:'HARI 2',title:'Task Orchestration',dur:'2 jam',
 sum:'Serahkan kerja besar kepada Claude sebagai siri langkah tersusun, dan bina sistem pemantauan tugasan live yang dikongsi kepada semua pegawai terlibat.',
 obj:['Memecah projek kepada WBS dengan pemilik, tempoh dan kebergantungan.','Membina sistem pemantauan tugasan live.','Menulis arahan berbilang langkah dengan titik semak.','Mencipta tugasan berjadual untuk kerja berulang.'],
 body:()=>sec('Lima langkah orkestrasi',flow([['Pecah','WBS: fasa dan tugasan'],['Susun','Tarikh dan kebergantungan'],['Agih','Pemilik dan beban kerja'],['Jalankan','Arahan berbilang langkah'],['Pantau','Papan pemuka live, tugasan berjadual']]))
 +sec('Konsep utama',cards([['Titik semak manusia','Nyatakan di mana Claude perlu berhenti: "BERHENTI selepas Langkah 1 dan tunggu pengesahan saya."'],['Tugasan berjadual','Setiap larian ialah sesi baharu. Arahan mesti lengkap dan berdiri sendiri.'],['Data live','Satu Google Sheet sebagai sumber tunggal. Semua pegawai melihat papan pemuka yang sama.']])),
 acts:[
  {id:'5.1',t:'Sistem pemantauan tugasan live',min:30,intro:'Bina papan pemuka web yang dikongsi melalui satu pautan. Pegawai mengemas kini status sendiri, dan paparan dimuat semula setiap 30 saat.',
   steps:['<b>Bina WBS:</b> jalankan prompt di bawah dan simpan hasilnya sebagai <code>WBS_PKPB3.csv</code>. Kesuntukan masa? Guna CSV contoh.','<b>Cipta pangkalan data:</b> Google Sheet baharu bernama <code>DB_Pemantauan_PKPB3</code>, kemudian <b>Extensions > Apps Script</b>.','<b>Tampal kod:</b> ganti <code>Code.gs</code>, tambah fail HTML bernama <code>Index</code>, klik Save.','<b>Sediakan helaian:</b> jalankan fungsi <code>setupSheet</code> dan beri kebenaran.','<b>Import WBS:</b> dalam helaian Tugasan, File > Import > Upload > Replace current sheet. Jalankan <code>setupSheet</code> sekali lagi.','<b>Terbit:</b> Deploy > New deployment > Web app. Execute as: <b>Me</b>. Akses: dalam organisasi.','<b>Kongsi:</b> salin Web app URL dan hantar kepada pasangan anda.','<b>Simulasi:</b> pasangan mengemas kini tugasan T07 kepada Selesai dari telefon. Perhatikan papan pemuka anda berubah dalam 30 saat.'],
   prompts:[['Prompt WBS','Anda pengurus projek latihan di IAB. Program Kepimpinan Pengetua Baharu Siri 3/2026\nberlangsung 7–11 Disember 2026. Pasukan urus setia: Ketua Urus Setia, Pegawai Kandungan,\nPegawai Logistik, Pegawai Penilaian, Pembantu Tadbir, Pegawai ICT.\n\nBina WBS dalam 5 fasa: Perancangan, Persediaan, Pelaksanaan, Penilaian, Penutupan\n(20–30 tugasan). Kenal pasti laluan kritikal dan pastikan beban kerja seimbang.\n\nBeri output sebagai CSV sahaja, dengan tajuk lajur TEPAT seperti ini:\nID,Tugasan,Fasa,Pemilik,Tarikh Mula,Tarikh Akhir,Bergantung Kepada,Status,% Siap,Catatan,Dikemas Kini,Oleh\n- ID: T01, T02, ...\n- Tarikh format YYYY-MM-DD, dikira daripada hari ini.\n- Status: Belum mula / Sedang / Selesai / Tersekat. Isikan status realistik setakat hari ini.\n- Lajur Dikemas Kini dan Oleh dibiarkan kosong.\n- Jangan guna koma dalam teks tugasan.\nSimpan sebagai fail WBS_PKPB3.csv.']],
   files:['pem_code','pem_index','pem_wbs'],out:'Papan pemuka live yang boleh diakses semua pegawai melalui satu pautan, dengan jejak audit setiap kemas kini.'},
  {id:'5.2',t:'Satu arahan, banyak hasil',min:30,
   prompts:[['Prompt','Guna fail dalam Project ini (Profil Program, Senarai Penceramah, Senarai Peserta).\nLaksanakan langkah berikut mengikut turutan:\n\nLangkah 1: Sahkan bilangan peserta mengikut negeri dan jantina. Paparkan jadual.\nLangkah 2: Cadangkan agihan bilik penginapan (2 orang sebilik, jantina sama, negeri berbeza\n           jika boleh). Hasilkan senarai dalam Excel.\nLangkah 3: Bahagikan peserta kepada 8 kumpulan perbincangan yang seimbang\n           (negeri, jantina, jenis sekolah).\nLangkah 4: Draf surat panggilan kursus kepada peserta (satu templat dengan ruang isian).\nLangkah 5: Sediakan senarai semak logistik hari pertama.\n\nBERHENTI selepas Langkah 1 dan tunggu pengesahan saya sebelum meneruskan.\nDi akhir, beri ringkasan semua fail yang dihasilkan.']],
   files:['a6'],out:'Agihan bilik, 8 kumpulan, templat surat dan senarai semak.',extra:note('Bincang: apa berlaku jika data Langkah 1 salah dan tiada titik semak?')},
  {id:'5.3',t:'Tugasan berjadual mingguan',min:25,steps:['Minta Claude: <i>"Jadualkan tugasan ini setiap Isnin 8.00 pagi."</i>','Tulis arahan lengkap yang berdiri sendiri (prompt di bawah).','Jalankan sekali secara manual untuk menguji hasilnya.','Semak tetapan kelulusan tugasan.'],
   prompts:[['Arahan tugasan berjadual','Setiap Isnin 8.00 pagi (waktu Malaysia):\nBaca helaian Tugasan dalam Google Sheet DB_Pemantauan_PKPB3 (melalui penyambung Google Drive).\nSediakan Laporan Status Mingguan 1 halaman:\n- Tugasan selesai minggu lepas\n- Tugasan lewat dan pemiliknya\n- Tugasan perlu bermula minggu ini\n- 3 risiko utama dan cadangan tindakan\nTulis dalam Bahasa Melayu, nada rasmi. Jangan ubah Sheet tersebut.']],out:'Satu tugasan berjadual yang telah diuji.'},
  {id:'5.4',t:'E-mel susulan dan peringatan',min:15,
   prompts:[['Prompt','Berdasarkan helaian Tugasan dalam DB_Pemantauan_PKPB3, draf e-mel ringkas kepada setiap\npemilik tugasan yang lewat. Nada: profesional, membantu, tidak menyalahkan.\nNyatakan tugasan, tarikh asal, dan minta tarikh baharu yang realistik.\nMaksimum 120 patah perkataan setiap e-mel. Draf sahaja, jangan hantar.']],out:'Draf e-mel bagi setiap pemilik tugasan lewat.'}
 ]},
{id:'modul-6',code:'M6',g:'HARI 2',title:'Data Intelligence',dur:'2 jam',
 sum:'Bersihkan data, jalankan analisis statistik, hasilkan carta dan tafsir dapatan penilaian kursus daripada 40 peserta.',
 obj:['Membersihkan dan menyemak kualiti data.','Menjalankan analisis deskriptif dan perbandingan kumpulan.','Menganalisis komen terbuka mengikut tema.','Menghasilkan carta dan mentafsir dapatan dengan berhati-hati.'],
 body:()=>sec('Lima soalan sebelum meminta analisis',flow([['Keputusan','Apa yang akan diputuskan?'],['Data','Lajur, skala, bilangan responden'],['Perbandingan','Sesi, kumpulan, pra-pasca'],['Ketepatan','Purata, peratus, ujian statistik'],['Bentuk hasil','Jadual, carta, ringkasan']]))
 +sec('Amalan baik',ul(['Minta Claude menunjukkan kaedah dan kod yang digunakan.','Semak dua angka penting secara rawak di Excel.','Jangan buat kesimpulan sebab-akibat daripada korelasi.','Laporkan saiz sampel (n) bersama setiap peratus.','Jangan muat naik data peribadi sebenar.'])),
 acts:[
  {id:'6.1',t:'Pembersihan dan semakan kualiti data',min:20,steps:['Jalankan prompt semakan kualiti.','Baca laporan isu dan luluskan tindakan yang sesuai.','Arahkan: <i>"Laksanakan pembersihan yang diluluskan. Simpan sebagai Penilaian_PKPB3_bersih.xlsx dengan helaian Log Pembersihan."</i>'],
   prompts:[['Prompt','Semak kualiti data dalam fail ini sebelum analisis. Laporkan:\n1. Bilangan baris dan lajur, jenis data setiap lajur.\n2. Nilai hilang mengikut lajur.\n3. Rekod pendua (ID peserta sama).\n4. Nilai di luar julat skala 1–5.\n5. Format tidak seragam (cth. "Johor", "JOHOR", "Jhr").\nCadangkan tindakan bagi setiap isu. JANGAN ubah data sehingga saya luluskan.']],
   files:['a7'],out:'Fail data bersih dengan log setiap perubahan.'},
  {id:'6.2',t:'Analisis kuantitatif penilaian',min:30,steps:['Jalankan prompt pada fail yang telah dibersihkan.','Pilih 2 angka dan sahkan sendiri dalam Excel (AVERAGE, COUNTIF).'],
   prompts:[['Prompt','Guna Penilaian_PKPB3_bersih.xlsx. Keputusan yang akan dibuat: sesi mana perlu\ndiperbaiki untuk Siri 4/2027.\n\n1. Kira min, sisihan piawai dan % skor 4–5 bagi setiap item dan setiap sesi.\n2. Kedudukan sesi dari tertinggi ke terendah berdasarkan min keseluruhan.\n3. Banding skor mengikut jenis sekolah (SK/SMK) dan pengalaman (<1 tahun, 1–3 tahun).\n   Nyatakan sama ada perbezaan bermakna secara statistik dan kaedah yang digunakan.\n4. Hasilkan 3 carta: (a) carta bar mendatar min setiap sesi disusun,\n   (b) carta bar bertindan taburan skor bagi 3 sesi terendah, (c) perbandingan kumpulan.\n5. Tulis 5 dapatan utama, setiap satu dengan angka dan n.\n\nTunjukkan kod yang digunakan pada akhir jawapan.']],out:'Kedudukan sesi, 3 carta dan 5 dapatan utama.'},
  {id:'6.3',t:'Analisis tema komen terbuka',min:25,steps:['Jalankan prompt pada lajur Komen atau fail komen.','Kodkan 10 komen secara manual bersama pasangan.','Banding dengan hasil Claude. Berapa peratus persetujuan?'],
   prompts:[['Prompt','Analisis komen terbuka secara tematik:\n1. Bina kerangka tema (maksimum 6 tema) dengan definisi ringkas.\n2. Kodkan setiap komen kepada tema (satu komen boleh ada lebih satu tema)\n   dan sentimen (Positif/Negatif/Cadangan).\n3. Jadual: Tema | Bilangan | % | Sentimen dominan | Petikan wakil.\n4. Silang dengan data kuantitatif: adakah sesi bermin rendah juga menerima komen negatif?\n5. Tambah lajur "Tema" dan "Sentimen" dalam fail Excel.']],
   files:['a3'],out:'Jadual tema dengan petikan wakil.'},
  {id:'6.4',t:'Analisis pra-pasca ujian',min:20,
   prompts:[['Prompt','Analisis impak pembelajaran:\n1. Min pra, min pasca, perubahan min dan % peserta yang meningkat.\n2. Uji kesignifikanan perbezaan (ujian-t berpasangan atau alternatif yang sesuai)\n   dan saiz kesan. Terangkan maknanya dalam bahasa mudah untuk pengurusan.\n3. Kenal pasti peserta yang skornya menurun (guna ID sahaja).\n4. Carta: plot pra vs pasca bagi setiap peserta.\n5. Nyatakan batasan analisis ini.']],
   files:['a8'],out:'Dapatan impak pembelajaran. Bentangkan satu dapatan dalam 2 minit: dapatan, bukti, cadangan.'}
 ]},
{id:'modul-7',code:'M7',g:'HARI 2',title:'Performance Reporting',dur:'1 jam',
 sum:'Laporan prestasi menjawab tiga soalan pengurusan: adakah sasaran dicapai, mengapa, dan apa tindakan seterusnya.',
 obj:['Memadankan data dengan KPI dan sasaran program.','Menulis laporan dengan struktur Sasaran, Pencapaian, Analisis, Tindakan.','Menghasilkan papan pemuka KPI dan ringkasan eksekutif.'],
 body:()=>sec('Sasaran KPI program',tbl(['KPI','Sasaran','Sumber data'],[['Kehadiran peserta','<span class="num">≥ 95%</span>','Data Operasi, helaian Kehadiran'],['Min kepuasan keseluruhan (1–5)','<span class="num">≥ 4.20</span>','Borang penilaian'],['% peserta skor pasca ≥ 35/50','<span class="num">≥ 80%</span>','Ujian pra-pasca'],['Peningkatan min pra-pasca','<span class="num">≥ 8 markah</span>','Ujian pra-pasca'],['Perbelanjaan berbanding peruntukan','<span class="num">≤ 100%</span>','Data Operasi, helaian Kewangan'],['Laporan program dihantar','<span class="num">≤ 14 hari</span>','Rekod urus setia']]))
 +sec('Struktur laporan',flow([['Sasaran',''],['Pencapaian','Angka'],['Status','Capai, hampir, tidak capai'],['Analisis','Punca berdasarkan data'],['Tindakan','Pemilik dan tarikh']])+note('<b>Prinsip.</b> Mulakan dengan kesimpulan. Satu angka penting setiap ayat. Jangan sembunyikan KPI yang tidak dicapai.')),
 acts:[
  {id:'7.1',t:'Laporan KPI program',min:25,steps:['Lampirkan hasil Modul 6 dan fail Data Operasi.','Jalankan prompt, tampal jadual KPI di atas.','Semak: adakah setiap angka dalam ringkasan sama dengan jadual?'],
   prompts:[['Prompt','Anda Pegawai Penilaian di IAB. Sediakan Laporan Prestasi Program Kepimpinan\nPengetua Baharu Siri 3/2026 kepada Mesyuarat Pengurusan.\n\nGuna jadual KPI berikut [tampal jadual KPI] dan data dalam fail-fail yang dilampirkan.\n\nStruktur:\n1. Ringkasan Eksekutif (maksimum 5 ayat, mulakan dengan pencapaian keseluruhan)\n2. Jadual KPI: KPI | Sasaran | Pencapaian | Status | Berbanding Siri 2/2026\n3. Analisis: KPI tidak dicapai dahulu, dengan punca berdasarkan data dan komen\n4. Pelan Tindakan Penambahbaikan: Isu | Tindakan | Pemilik | Tarikh\n5. Lampiran: kaedah dan saiz sampel\n\nJangan reka angka. Tulis [DATA TIADA] jika KPI tidak dapat dikira.\nHasilkan sebagai dokumen Word.']],
   files:['a8','a9'],out:'Laporan prestasi dalam format Word.'},
  {id:'7.2',t:'Papan pemuka KPI satu halaman',min:15,
   prompts:[['Prompt','Daripada laporan ini, bina papan pemuka satu halaman:\n- Baris atas: 6 kad KPI (angka besar, sasaran, warna status hijau/kuning/merah)\n- Tengah: carta min kepuasan setiap sesi dan carta pra vs pasca\n- Bawah: 3 tindakan utama\nPastikan setiap angka menyatakan sumbernya.']],out:'Papan pemuka yang boleh dikongsi melalui pautan atau dieksport sebagai PDF.'},
  {id:'7.3',t:'Ringkasan eksekutif 150 patah perkataan',min:10,
   prompts:[['Prompt','Tulis semula ringkasan eksekutif untuk Pengarah IAB dalam 150 patah perkataan.\nPembaca hanya ada 1 minit. Tiga perenggan: Pencapaian, Isu utama, Keputusan dipohon.']],out:'Ringkasan yang dibaca kepada kumpulan. Adakah keputusan yang dipohon jelas?'}
 ]},
{id:'modul-8',code:'M8',g:'HARI 2',title:'Integrated Management Workflow',dur:'2 jam',
 sum:'Gabungkan Modul 1 hingga 7 menjadi satu aliran kerja pengurusan lengkap, dan siapkan Pakej Penutupan Program dalam masa terhad.',
 obj:['Mengaplikasi kitaran Rancang, Laksana, Nilai, Lapor, Tambah baik.','Menghasilkan pakej dokumen pengurusan bersepadu.','Mereka bentuk SOP aliran kerja Claude untuk unit sendiri.'],
 body:()=>sec('Peta aliran kerja bersepadu',tbl(['Fasa','Kerja','Modul','Hasil'],[['Rancang','Kertas cadangan, semakan silang dokumen','M2 · M3 · M4','Kertas cadangan, jadual program'],['Laksana','WBS, surat, pemantauan, tugasan berjadual','M4 · M5','Papan pemuka tugasan, surat'],['Nilai','Pembersihan dan analisis data','M6','Dapatan, carta'],['Lapor','Laporan KPI, papan pemuka, ringkasan','M7','Laporan prestasi'],['Tambah baik','Pelajaran dipelajari, cadangan siri seterusnya','M8','Pakej penutupan, SOP']])),
 acts:[
  {id:'8.1',t:'Cabaran Pakej Penutupan Program',min:60,intro:'Program telah tamat semalam. Pengarah mahu pakej ini dibentangkan di Mesyuarat Pengurusan esok pagi. Seorang menjadi Pemandu, seorang Penyemak. Tukar peranan pada minit ke-30.',
   steps:['Laporan Program Lengkap (Word, 5–8 halaman)','Papan Pemuka KPI satu halaman','Slaid taklimat 6–8 slaid','Surat penghargaan kepada semua penceramah','Dokumen Pelajaran Dipelajari dan Cadangan Siri 4/2027'],
   prompts:[['Prompt permulaan','Anda Ketua Urus Setia Program Kepimpinan Pengetua Baharu Siri 3/2026.\nProgram telah tamat. Guna semua fail dalam Project ini.\n\nSediakan Pakej Penutupan Program mengikut turutan:\n1. Rancang: senaraikan 5 hasil, bahan yang diperlukan bagi setiap satu,\n   dan data yang tiada. BERHENTI dan tunggu kelulusan saya.\n2. Laporan Program Lengkap (Word): Pengenalan, Pelaksanaan, Penilaian Reaksi,\n   Impak Pembelajaran, Prestasi KPI, Kewangan, Isu & Cabaran, Syor.\n3. Papan Pemuka KPI satu halaman.\n4. Slaid taklimat 6–8 slaid; slaid terakhir: keputusan yang dipohon.\n5. Surat penghargaan kepada setiap penceramah, menyebut tajuk sesi dan\n   min penilaian sesi mereka.\n6. Pelajaran Dipelajari: Apa berjaya | Apa tidak berjaya | Cadangan Siri 4/2027.\n7. Semak silang: pastikan semua angka konsisten antara 5 hasil.\n   Senaraikan percanggahan dan betulkan.\n\nAkhiri dengan senarai perkara yang mesti saya semak sendiri sebelum dibentangkan.']],
   files:['zipdata'],out:'Lima hasil yang angkanya konsisten antara satu sama lain.',
   extra:sec('Senarai semak penyemak',`<ul class="checks">${['Semua nama, tarikh, angka dan rujukan disahkan dengan sumber asal','Tiada maklumat rekaan atau [PERLU DISAHKAN] yang tertinggal','Angka konsisten di semua bahagian dan dokumen','Bahasa baku, nada dan format mengikut piawai agensi','Tiada data peribadi atau terperingkat yang terdedah','Kesimpulan disokong oleh data, bukan andaian'].map((t,i)=>`<li><label for="ck${i}"><input type="checkbox" id="ck${i}"><span>${t}</span></label></li>`).join('')}</ul>`)},
  {id:'8.2',t:'Reka aliran kerja unit sendiri',min:25,intro:'Pilih satu proses berulang di unit anda, contohnya laporan prestasi suku tahun atau penyediaan bahan mesyuarat bulanan.',
   prompts:[['Prompt','Bantu saya mendokumenkan aliran kerja Claude untuk proses: [NAMA PROSES].\nTanya saya soalan satu demi satu, kemudian hasilkan SOP dengan bahagian:\n1. Tujuan dan skop\n2. Input (fail, data, sumber)\n3. Langkah demi langkah: Langkah | Siapa (manusia/Claude) | Prompt atau templat | Hasil\n4. Titik semak manusia dan kriteria kelulusan\n5. Tugasan berjadual (jika ada): kekerapan dan arahan\n6. Risiko (ketepatan, kerahsiaan data) dan kawalan\n7. Anggaran masa sebelum dan selepas guna Claude']],out:'SOP aliran kerja untuk unit anda.'},
  {id:'8.3',t:'Pelan tindakan 30 hari',min:5,intro:'Catatan ini disimpan dalam pelayar anda sahaja.',
   extra:`<div class="form">${[['Satu tugasan yang akan saya serahkan kepada Claude minggu depan','p30a'],['Satu templat prompt yang akan saya kongsi dengan rakan sejawat','p30b'],['Satu tugasan berjadual yang akan saya cipta','p30c'],['Satu metrik untuk mengukur masa yang dijimatkan','p30d']].map(([l,k])=>`<div class="fld"><label for="${k}">${l}</label><textarea id="${k}" rows="2" data-save="${k}"></textarea></div>`).join('')}<div><button class="btn sm" type="button" data-copy-plan>Salin pelan saya</button></div></div>`}
 ],
 tail:()=>sec('Rubrik projek akhir',tbl(['Kriteria','4 Cemerlang','3 Baik','2 Memuaskan','1 Perlu bimbingan'],[['Kelengkapan hasil','5 hasil','4 hasil','3 hasil','≤ 2 hasil'],['Ketepatan angka','Tiada percanggahan','1 percanggahan kecil','2–3 percanggahan','Banyak percanggahan'],['Prompt dan aliran kerja','Berstruktur, ada titik semak','Titik semak kurang','Sebahagian berstruktur','Ad hoc'],['Bahasa dan format rasmi','Baku, format tepat','Kesilapan kecil','Beberapa kesilapan','Tidak ikut format'],['SOP unit sendiri','Jelas, ada kawalan risiko','Kawalan risiko kurang','Kurang terperinci','Tidak lengkap']])+`<p class="mute">Markah penuh 20. Sasaran lulus: 12 ke atas.</p>`)},
{id:'bina-sistem',code:'T1',g:'LANJUTAN',title:'Bina Sistem dengan Claude',dur:'2 jam',
 sum:'Bina aplikasi web sebenar dengan Claude sebagai pembangun. Pangkalan datanya Google Sheet, dihubungkan melalui Extensions > Apps Script.',
 obj:['Menulis spesifikasi keperluan sistem bersama Claude.','Mereka bentuk struktur data dalam Google Sheet.','Memasang dan menerbitkan aplikasi web Apps Script.','Menambah ciri dan membetulkan ralat dengan bantuan Claude.'],
 body:()=>sec('Seni bina sistem',flow([['Pengguna','Buka pautan di pelayar atau telefon'],['Index.html','Borang dan papan pemuka'],['google.script.run','Hantar data ke pelayan'],['Code.gs','Semak data, baca dan tulis'],['Google Sheet','Helaian Peserta dan Penilaian']]))
 +sec('Kitaran bina dengan Claude',tbl(['Langkah','Peranan anda','Peranan Claude'],[['Spesifikasi','Terangkan masalah dan pengguna','Tanya soalan, tulis spesifikasi'],['Reka data','Sahkan medan yang perlu','Cadang helaian, lajur, peraturan'],['Prototaip','Beri maklum balas rupa dan aliran','Bina prototaip antara muka'],['Kod','Salin, tampal, uji','Tulis Code.gs dan Index.html'],['Uji dan betulkan','Salin mesej ralat sebenar','Terangkan punca, beri pembetulan']])+note('<b>Peraturan emas.</b> Minta satu perubahan pada satu masa, uji, kemudian minta perubahan seterusnya.'))
 +sec('Penyelesaian masalah',tbl(['Gejala','Tindakan'],[['<code>Helaian "Peserta" tiada</code>','Jalankan <code>setupSheets</code> dari editor.'],['<code>No HTML file named Index</code>','Namakan fail HTML tepat <code>Index</code>.'],['Perubahan kod tidak kelihatan','Manage deployments > Edit > Version: New version.'],['Skrin kebenaran disekat','Minta pentadbir benarkan Apps Script, atau guna akaun latihan.'],['Borang tidak menghantar','Tekan F12 > Console, salin ralat kepada Claude.']]))
 +note('<b>Keselamatan.</b> Guna data rekaan sahaja. Hadkan akses kepada organisasi. Jangan simpan No. KP atau data terperingkat. Semak kod yang dijana sebelum diterbitkan.','warn'),
 acts:[
  {id:'B.1',t:'Spesifikasi keperluan',min:15,
   prompts:[['Prompt','Saya pegawai IAB tanpa latar belakang pengaturcaraan. Saya mahu membina sistem\nkecil menggunakan Google Sheets sebagai pangkalan data dan Google Apps Script\nsebagai aplikasi web.\n\nMasalah: [cth. borang penilaian kursus kertas lambat dianalisis].\nPengguna: [cth. 40 peserta kursus, 6 urus setia].\n\nTanya saya soalan satu demi satu (maksimum 8) tentang pengguna, data, proses\ndan laporan. Kemudian tulis spesifikasi 1 halaman:\n1. Tujuan sistem\n2. Pengguna dan apa yang setiap pengguna boleh buat\n3. Senarai skrin/borang\n4. Struktur data: helaian, lajur, jenis data, peraturan (wajib isi, julat, unik)\n5. Laporan/papan pemuka\n6. Di luar skop versi 1']],out:'Spesifikasi 1 halaman yang diluluskan oleh pasangan.'},
  {id:'B.2',t:'Prototaip antara muka',min:15,steps:['Jalankan prompt.','Beri 2 maklum balas, cth. <i>"Tambah medan Negeri sebagai senarai pilihan."</i>'],
   prompts:[['Prompt','Berdasarkan spesifikasi ini, bina prototaip antara muka yang boleh saya lihat\ndan klik: 3 tab (Pendaftaran, Penilaian, Papan Pemuka), warna biru gelap rasmi,\nmesra telefon. Guna data contoh rekaan. Ini prototaip sahaja, belum disambung ke Sheet.']],out:'Prototaip yang boleh diklik.'},
  {id:'B.3',t:'Pasang Sistem Pengurusan Program',min:35,steps:['Google Drive > New > Google Sheets. Namakan <code>DB_Sistem_PKPB3</code>.','Klik <b>Extensions > Apps Script</b>.','Padam kandungan <code>Code.gs</code>, tampal kod pelayan.','Klik + > HTML, namakan <code>Index</code>, tampal kod antara muka.','Klik Save. Pilih fungsi <code>setupSheets</code>, klik Run, beri kebenaran (Advanced > Go to).','Deploy > New deployment > Web app. Execute as: <b>Me</b>.','Buka Web app URL. Daftar 3 peserta, cuba e-mel pendua, hantar 5 penilaian, buka Papan Pemuka.'],
   files:['prog_code','prog_index'],out:'Aplikasi web yang menulis ke Google Sheet anda.',extra:note('Selepas mengubah kod: Deploy > Manage deployments > Edit > Version: New version > Deploy.')},
  {id:'B.4',t:'Tambah satu ciri dengan Claude',min:30,intro:'Pilih satu: tapis peserta mengikut negeri, Negeri sebagai senarai pilihan, muat turun CSV, kemas kini dan padam rekod, e-mel pengesahan, atau carta min skor.',
   prompts:[['Templat prompt','Ini sistem Google Apps Script saya (Code.gs dan Index.html) yang menggunakan\nGoogle Sheet sebagai pangkalan data:\n<code_gs>\n[tampal Code.gs]\n</code_gs>\n<index_html>\n[tampal Index.html]\n</index_html>\n\nTambah ciri: [pilih daripada senarai].\nSyarat:\n- Jangan ubah struktur lajur sedia ada; tambah lajur baharu di hujung jika perlu.\n- Beri fail PENUH yang berubah sahaja, sedia untuk ditampal.\n- Terangkan dalam 3 ayat apa yang berubah dan cara mengujinya.\n- Senaraikan sebarang kebenaran (authorization) baharu yang akan diminta.']],out:'Satu ciri baharu yang berfungsi. Demo 2 minit.'},
  {id:'B.5',t:'Cabaran nyahpepijat',min:15,intro:'Jurulatih akan memasukkan satu ralat ke dalam sistem anda. Cari puncanya bersama Claude.',
   prompts:[['Prompt','Papan Pemuka sistem saya memaparkan "Belum ada penilaian." walaupun helaian Penilaian\nmempunyai 5 baris data. Tajuk lajur helaian Penilaian: Masa | ID Peserta | Sesi | Skor | Komen.\nIni fungsi berkaitan:\n[tampal fungsi ringkasanPenilaian]\nApakah punca dan bagaimana membetulkannya? Terangkan dengan bahasa mudah.']],out:'Punca ralat dan pembetulan.'}
 ]},
{id:'agentic-ai',code:'T2',g:'LANJUTAN',title:'Bina Agentic AI',dur:'2 jam',
 sum:'Agen AI diberi matlamat, bukan sekadar soalan. Ia merancang langkah sendiri, menggunakan alat dan meneruskan kerja sehingga matlamat dicapai, dalam batas yang anda tetapkan.',
 obj:['Menerangkan perbezaan chatbot, aliran kerja dan agen AI.','Mereka bentuk agen menggunakan Kanvas Agen.','Membina agen tanpa kod: Projects, Skills dan tugasan berjadual.','Memasang agen autonomi yang menggunakan Claude API dalam Apps Script.'],
 body:()=>sec('Chatbot, aliran kerja, agen',tbl(['','Chatbot','Aliran kerja','Agen AI'],[['Input','Soalan','Arahan langkah demi langkah','Matlamat'],['Siapa tentukan langkah','Manusia','Manusia (tetap)','Claude (fleksibel)'],['Guna alat','Tidak','Kadang-kadang','Ya, pilih sendiri'],['Bila berhenti','Selepas satu jawapan','Selepas langkah terakhir','Matlamat atau had dicapai']]))
 +sec('Gelung agen',flow([['Faham','Matlamat'],['Rancang','Langkah'],['Pilih alat',''],['Laksana',''],['Nilai','Hasil'],['Ulang','Sehingga selesai']])+`<p><a class="btn" href="#kanvas-agen">Buka Kanvas Agen</a></p>`)
 +sec('Kawalan keselamatan agen',ul(['<b>Akses minimum:</b> beri alat yang perlu sahaja.','<b>Manusia dalam gelung:</b> hantar, padam dan kongsi mesti diluluskan manusia.','<b>Had pusingan dan log audit:</b> elak gelung tanpa henti, rekod setiap tindakan.','<b>Suntikan arahan:</b> data yang dibaca agen ialah maklumat, bukan arahan.','<b>Rahsia:</b> simpan kunci API dalam Script Properties, bukan dalam kod.']))
 +sec('Penyelesaian masalah Tahap 4',tbl(['Ralat','Tindakan'],[['<code>ANTHROPIC_API_KEY belum ditetapkan</code>','Tambah Script Property dengan nama tepat.'],['<code>Ralat API 401</code>','Kunci API salah atau dibatalkan.'],['<code>Ralat API 404</code>','Kemas kini <code>MODEL_CLAUDE</code> mengikut nama model terkini.'],['Menu Agen AI tiada','Muat semula Sheet. Pastikan Agen.gs dalam projek yang sama.'],['Tiada draf dicipta','Semak e-mel dalam helaian Pegawai.']])),
 acts:[
  {id:'T.1',t:'Tahap 1 · Agen dalam Project',min:15,steps:['Gantikan arahan Project <b>Urus Setia PKPB Siri 3-2026</b> dengan arahan agen.','Uji dengan matlamat: <i>"Pastikan semua penceramah bersedia untuk program."</i>','Perhatikan: adakah agen merancang sendiri?'],
   prompts:[['Arahan agen','PERANAN: Anda Agen Pembantu Urus Setia Program Kepimpinan Pengetua Baharu Siri 3/2026, IAB.\nMATLAMAT: Bantu urus setia menyiapkan tugasan program dengan tepat dan tepat masa.\n\nCARA BEKERJA (untuk setiap permintaan):\n1. Kenal pasti hasil akhir yang diperlukan. Jika kabur, tanya maksimum 2 soalan.\n2. Rancang langkah dan paparkan pelan ringkas.\n3. Guna fail dalam Project ini sebagai sumber utama. Nyatakan sumber bagi setiap fakta.\n4. Hasilkan output siap guna (dokumen, jadual, draf e-mel).\n5. Semak sendiri: fakta, angka, tarikh, format. Betulkan sebelum menyerahkan.\n6. Akhiri dengan: "Perkara untuk anda semak" dan "Cadangan langkah seterusnya".\n\nSEMPADAN: Jangan reka fakta. Jangan hantar apa-apa bagi pihak pengguna. Tandakan [PERLU DISAHKAN].']],out:'Project yang bertindak sebagai agen.'},
  {id:'T.2',t:'Tahap 2 · Skill tersuai',min:20,intro:'Skill ialah buku panduan prosedur yang Claude gunakan secara automatik dalam mana-mana perbualan.',steps:['<b>Cara A:</b> aktifkan skill-creator, jalankan prompt di bawah, muat turun ZIP yang dihasilkan.','<b>Cara B:</b> guna skill contoh <code>minit-mesyuarat-iab.zip</code>.','Muat naik di <b>Customize > Skills > + > Upload a skill</b>.','Uji dalam perbualan baharu: tampal nota mesyuarat dan tulis <i>"Sediakan minit."</i>'],
   prompts:[['Prompt cipta skill','Saya mahu cipta skill bernama minit-mesyuarat-iab. Skill ini menukar nota kasar mesyuarat\nkepada Minit Mesyuarat rasmi format sektor awam Malaysia: Kehadiran, Perutusan Pengerusi,\nPengesahan Minit Lalu, Perkara Berbangkit, Perkara Baharu, Hal-hal Lain, Penutup,\nKeputusan dan Tindakan bagi setiap perkara, serta Jadual Tindakan di hujung.\nTanya saya soalan untuk melengkapkan skill ini, kemudian bungkus sebagai fail ZIP.']],

function buildPrompt(v){
  const o=[];
  if(v.p)o.push('Anda '+v.p.replace(/^anda\s+/i,'').replace(/\.$/,'')+'.');
  if(v.k)o.push('Konteks:\n'+v.k);
  if(v.t)o.push('Tugasan:\n'+v.t);
  if(v.f)o.push('Format output:\n'+v.f);
  if(v.c)o.push('Contoh gaya yang dikehendaki:\n'+v.c);
  o.push('Kekangan:\n'+(v.x?v.x+'\n':'')+'Jika maklumat tidak mencukupi, tanya saya dahulu. Jangan reka fakta.');
  return o.join('\n\n');
}

function startNet(){
  const c=$('#net');if(!c)return;const x=c.getContext('2d');const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w,h,pts=[];const tok=startNet.tok=(startNet.tok||0)+1;
  function size(){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);
    const n=Math.max(18,Math.min(46,Math.round(w*h/15000)));pts=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,r:Math.random()<.18?2.4:1.3}))}
  function draw(){
    if(tok!==startNet.tok)return;
    x.clearRect(0,0,w,h);
    for(let i=0;i<pts.length;i++){const p=pts[i];
      if(!still){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1}
      for(let j=i+1;j<pts.length;j++){const q=pts[j],d=Math.hypot(p.x-q.x,p.y-q.y);
        if(d<130){x.strokeStyle='rgba(69,224,255,'+(.28*(1-d/130)).toFixed(3)+')';x.lineWidth=1;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}
      x.fillStyle=p.r>2?'rgba(255,179,65,.9)':'rgba(69,224,255,.85)';x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill();}
    if(!still&&c.isConnected)requestAnimationFrame(draw);
  }
  size();draw();
  if(!startNet.bound){startNet.bound=true;addEventListener('resize',()=>{const k=$('#net');if(k){startNet()}})}
}

  const same=id===current;current=id;
  const deck=$('#dek');tabSeq=0;
  deck.innerHTML=MBY[id]?viewModule(MBY[id]):VIEWS[id]();
  $$('#rel a').forEach(a=>{if(a.dataset.nav===id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  $('#rel').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');
  paintProgress();
  $$('[data-save]').forEach(t=>{if(t.tagName==='TEXTAREA')t.value=store.get('iab.note.'+t.dataset.save,'')});
  if(id==='utama')startNet();
  if(id==='makmal-prompt')paintPrompt();
  if(id==='kanvas-agen')paintKanvas();
  if(id==='kuiz')paintQuiz();
  if(!same){scrollTo(0,0)}
}
addEventListener('hashchange',route);

/* ---------- Peristiwa ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,[data-opt]');if(!t)return;
  if(t.matches('a[href^="#"]')){const id=t.getAttribute('href').slice(1);e.preventDefault();if(id==='dek'){$('#dek').focus();return}if(location.hash==='#'+id)route();else location.hash=id;return}
  if(t.id==='menuBtn'){const o=$('#rel').classList.toggle('open');t.setAttribute('aria-expanded',o);return}
  if(t.hasAttribute('data-copy')){copyText(t.closest('.prompt').querySelector('pre').textContent,t);return}
  if(t.dataset.copyText){copyText(t.dataset.copyText,t);return}
  if(t.dataset.copyFile){copyText(FBY[t.dataset.copyFile].text,t);return}
  if(t.hasAttribute('data-copy-plan')){const L=$$('[data-save]').filter(x=>x.tagName==='TEXTAREA');copyText('PELAN TINDAKAN 30 HARI\n\n'+L.map((x,i)=>(i+1)+'. '+x.previousElementSibling.textContent+':\n   '+(x.value.trim()||'-')).join('\n'),t);return}
  if(t.dataset.tab!=null){const box=t.closest('.tabs');$$('[role=tab]',box).forEach(b=>b.setAttribute('aria-selected',b===t));$$('[data-panel]',box).forEach(p=>p.hidden=p.dataset.panel!==t.dataset.tab);return}
  if(t.dataset.timer){startT(+t.dataset.timer,t.dataset.name);return}
  if(t.dataset.file){openFile(t.dataset.file);return}
  if(t.tagName==='BUTTON'&&t.dataset.save){saveFile(t.dataset.save);return}
  if(t.dataset.opt!=null){const i=+t.closest('.q').dataset.q;if(QA[i]==null){QA[i]=+t.dataset.opt;paintQuiz()}return}
  if(t.id==='qReset'){QA={};paintQuiz();return}
  if(t.id==='kvEx'||t.id==='kvClear'){$$('[data-kv]').forEach(x=>x.value=t.id==='kvEx'?KV_EX[x.dataset.kv]:'');paintKanvas();return}
  if(t.id==='tPause'){if(T.run){T.run=false;t.textContent='Sambung'}else if(T.left>0){T.end=Date.now()+T.left*1000;T.run=true;t.textContent='Jeda';$('#timer').classList.remove('end');clearInterval(T.iv);T.iv=setInterval(tickT,500)}return}
  if(t.id==='tPlus'){T.left+=60;T.end+=60000;if(!T.run)T.end=Date.now()+T.left*1000;$('#timer').classList.remove('end');$('#tName').textContent=$('#tName').dataset.n;tickT();return}
  if(t.id==='tClose'){clearInterval(T.iv);T.run=false;$('#timer').hidden=true;return}
  if(t.id==='vClose'){closeViewer();return}
  if(t.id==='vCopy'){copyText(vFile.text,t);return}
  if(t.id==='vSave'){saveFile(vFile.id);return}
});
$('#viewer').addEventListener('click',e=>{if(e.target.id==='viewer')closeViewer()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#viewer').hidden)closeViewer();else $('#rel').classList.remove('open')}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.done){if(t.checked)DONE.add(t.dataset.done);else DONE.delete(t.dataset.done);store.set('iab.done',[...DONE]);t.closest('.act').classList.toggle('is-done',t.checked);paintProgress();if(t.checked&&DONE.size===TOTAL)toast('Semua aktiviti selesai. Tahniah!','ok');return}
  if(t.id==='pkPreset'&&t.value){const p=t.value==='kosong'?{}:PRESET[t.value];$$('[data-pk]').forEach(x=>x.value=p[x.dataset.pk]||'');t.value='';paintPrompt()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.pk)paintPrompt();
  else if(t.dataset.kv)paintKanvas();
  else if(t.tagName==='TEXTAREA'&&t.dataset.save)store.set('iab.note.'+t.dataset.save,t.value);
});
document.addEventListener('submit',e=>e.preventDefault());

renderNav();route();getDl();
</script>
</body>
</html>
